<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="_shared.css">
<style>
  body {
    width: 1200px; height: 900px;
    padding: 56px 64px;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    font-size: 26px; font-weight: 700; text-align: center;
    letter-spacing: -0.02em; max-width: 900px; line-height: 1.3;
    margin-bottom: 48px; color: #0f172a;
  }
  .flow { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 480px; }
  .step {
    width: 100%;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 16px 24px;
    text-align: center;
    font-size: 15px;
    font-weight: 500;
    color: #334155;
  }
  .step.highlight {
    background: #eff6ff;
    border-color: #93c5fd;
    color: #1e40af;
    font-weight: 600;
  }
  .step.product {
    background: #f0fdf4;
    border-color: #86efac;
    color: #166534;
    font-weight: 600;
  }
  .arrow {
    width: 2px; height: 28px;
    background: #cbd5e1;
    position: relative;
  }
  .arrow::after {
    content: ""; position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%);
    border-left: 6px solid transparent; border-right: 6px solid transparent;
    border-top: 8px solid #cbd5e1;
  }
  .footer {
    margin-top: 40px;
    font-size: 12px;
    color: #94a3b8;
    text-align: center;
  }
  .tag { margin-top: 12px; }
</style>
</head>
<body>
  <h1>Evals Are Product Specifications Disguised As Tests</h1>
  <div class="flow">
    <div class="step">User Problem</div>
    <div class="arrow"></div>
    <div class="step">Desired Behavior</div>
    <div class="arrow"></div>
    <div class="step product">Product Decision</div>
    <div class="arrow"></div>
    <div class="step highlight">Evaluation Criteria</div>
    <div class="arrow"></div>
    <div class="step highlight">Golden Dataset</div>
    <div class="arrow"></div>
    <div class="step">Release Gate</div>
    <div class="arrow"></div>
    <div class="step">AI System Behavior</div>
  </div>
  <div class="footer">
    Knowledge Agent · Anonymized portfolio case study
    <div class="tag"><span class="sample-label">Sample / design exercise</span></div>
  </div>
</body>
</html>
